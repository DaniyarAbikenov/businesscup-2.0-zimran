# Development stack: hot reload for backend (uvicorn --reload) and frontend (Vite HMR).
# Start everything with:  docker compose up --build
name: roleshift

x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-roleshift}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roleshift}
  POSTGRES_DB: ${POSTGRES_DB:-roleshift}
  REDIS_URL: redis://redis:6379/0
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
  DEMO_MODE: ${DEMO_MODE:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roleshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roleshift}
      POSTGRES_DB: ${POSTGRES_DB:-roleshift}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits. Backend waits for it.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      <<: *backend-env
      WATCHFILES_FORCE_POLLING: "true" # reliable reload on bind mounts (macOS/Windows)
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keep container-installed deps, not the host's
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
